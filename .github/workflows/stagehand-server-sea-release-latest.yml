name: Update stagehand/server latest binaries

# This workflow builds and releases SEA binaries when the core SDK changes.
# Since SEA bundles the core SDK (@browserbasehq/stagehand), any core change
# requires new binaries. This workflow is separate from the main release workflow
# which handles versioned releases.

on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
  workflow_dispatch:

permissions:
  contents: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  OAS_PATH: packages/server/openapi.v3.yaml

jobs:
  detect:
    name: Detect core SDK changes
    runs-on: ubuntu-latest
    outputs:
      build_latest: ${{ steps.meta.outputs.build_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Determine if core SDK has changes
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag -l 'stagehand-server/v*' --sort=-v:refname | head -n 1 || true)"
          rm -f changeset-status.json
          if [ -n "${latest_tag}" ]; then
            pnpm changeset status --since "${latest_tag}" --output changeset-status.json
          else
            pnpm changeset status --output changeset-status.json
          fi

          node <<'NODE'
          const fs = require('fs');

          const status = JSON.parse(fs.readFileSync('changeset-status.json', 'utf8'));
          const changesets = Array.isArray(status.changesets) ? status.changesets : [];

          // Check if server package has changesets (handled by stagehand-server-release.yml)
          const hasServerChanges = changesets.some((cs) =>
            (cs.releases || []).some((r) => r?.name === '@browserbasehq/stagehand-server')
          );

          // Check if core SDK has changesets
          const hasCoreChanges = changesets.some((cs) =>
            (cs.releases || []).some((r) => r?.name === '@browserbasehq/stagehand')
          );

          // Build 'latest' binaries only when:
          // - Core SDK has changes AND
          // - Server package does NOT have changes (otherwise stagehand-server-release.yml handles it)
          const shouldBuildLatest = hasCoreChanges && !hasServerChanges;

          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `build_latest=${shouldBuildLatest ? 'true' : 'false'}\n`);
          NODE

  build_binaries:
    name: Build SEA binaries
    needs: detect
    if: needs.detect.outputs.build_latest == 'true'
    uses: ./.github/workflows/stagehand-server-sea-build.yml

  release_latest:
    name: Update latest SEA binaries
    needs: [detect, build_binaries]
    if: needs.detect.outputs.build_latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare release assets directory
        run: mkdir -p release-assets

      - name: Prepare stagehand/server release assets
        run: |
          set -euo pipefail
          cp "${{ env.OAS_PATH }}" "release-assets/openapi.v3.yaml"

      - name: Download SEA binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stagehand-server-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          files=(stagehand-server-*)
          bins=()
          for f in "${files[@]}"; do
            [[ "$f" == *openapi* ]] && continue
            [[ -f "$f" ]] && bins+=("$f")
          done
          : > checksums.sha256
          if [ "${#bins[@]}" -gt 0 ]; then
            shasum -a 256 "${bins[@]}" > checksums.sha256
          fi

      - name: Delete existing latest tag (to move it)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the existing tag if it exists, so we can recreate it at the new commit
          git push origin :refs/tags/stagehand-server/latest 2>/dev/null || true

      - name: Update latest release with new binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stagehand-server/latest
          name: stagehand/server (latest)
          body: |
            This release contains the latest SEA binaries built from the main branch.
            These binaries include the most recent core SDK changes.

            For stable, versioned releases, see the tagged releases (e.g., `stagehand-server/v3.5.0`).

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp }}
          prerelease: true
          files: |
            release-assets/openapi.v3.yaml
            release-assets/stagehand-server-*
            release-assets/checksums.sha256
